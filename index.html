<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Maker – Morais Eden demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..850&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E7EEF6;
  --grid:rgba(47,111,179,.07);
  --grid-major:rgba(47,111,179,.13);
  --blob1:rgba(120,170,230,.50);
  --blob2:rgba(255,196,90,.40);
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.85);
  --stroke:rgba(16,35,63,.11);
  --track:rgba(16,35,63,.08);
  --text:#10233F;
  --muted:#53647C;
  --plan:#2F6FB3;
  --act:#D98500;
  --on-act:#1A1200;
  --ok:#17905A;
  --warn:#B87700;
  --late:#CF3539;
  --shadow:0 12px 32px rgba(16,35,63,.08);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1D35;
    --grid:rgba(127,178,229,.06);
    --grid-major:rgba(127,178,229,.12);
    --blob1:rgba(40,110,200,.45);
    --blob2:rgba(255,160,20,.16);
    --glass:rgba(255,255,255,.06);
    --glass-strong:rgba(255,255,255,.12);
    --stroke:rgba(255,255,255,.12);
    --track:rgba(255,255,255,.09);
    --text:#EAF1FA;
    --muted:#9DB0C8;
    --plan:#7FB2E5;
    --act:#FFB020;
    --ok:#3DD68C;
    --warn:#FFB020;
    --late:#FF6B6E;
    --shadow:0 12px 32px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1D35;
  --grid:rgba(127,178,229,.06);
  --grid-major:rgba(127,178,229,.12);
  --blob1:rgba(40,110,200,.45);
  --blob2:rgba(255,160,20,.16);
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.12);
  --track:rgba(255,255,255,.09);
  --text:#EAF1FA;
  --muted:#9DB0C8;
  --plan:#7FB2E5;
  --act:#FFB020;
  --ok:#3DD68C;
  --warn:#FFB020;
  --late:#FF6B6E;
  --shadow:0 12px 32px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.backdrop{
  position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(42vmax 42vmax at 88% 6%,var(--blob2),transparent 62%),
    radial-gradient(48vmax 48vmax at 4% 96%,var(--blob1),transparent 62%),
    var(--bg);
}
.bg-grid{
  position:absolute;inset:-120px;
  background:
    linear-gradient(var(--grid-major) 1px,transparent 1px) 0 0/120px 120px,
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px) 0 0/120px 120px,
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;
  animation:gridpan 40s linear infinite;
}
@keyframes gridpan{to{transform:translate(120px,120px)}}
a{color:inherit}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px;border-radius:6px}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--stroke);
  border-radius:20px;
  box-shadow:var(--shadow);
}

/* Layout */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:20px;max-width:1440px;margin:0 auto}
.side{
  position:sticky;top:calc(20px + env(safe-area-inset-top,0px));
  height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;padding:18px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:18px;font-stretch:80%;font-weight:800;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:560}
.nav a:hover{color:var(--text);background:var(--glass-strong)}
.nav a[aria-current="page"]{color:var(--text);background:var(--glass-strong);box-shadow:inset 3px 0 0 var(--act)}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.side-foot p{margin:0;font-size:12.5px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:12px}
.bottomnav{display:none}

/* Type & common */
h1{font-size:clamp(30px,3.8vw,44px);font-stretch:80%;font-weight:780;line-height:1.02;margin:0;letter-spacing:-.005em}
h2{font-size:19px;font-stretch:90%;font-weight:720;margin:0 0 2px}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:70ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 4px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.panel{padding:20px 22px}
.btn{
  appearance:none;border:1px solid var(--stroke);background:var(--glass-strong);color:var(--text);
  font:inherit;font-weight:620;padding:10px 16px;border-radius:12px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.btn:hover{border-color:var(--plan)}
.btn.primary{background:var(--act);color:var(--on-act);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:650;white-space:nowrap;justify-self:start}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.late{color:var(--late);background:color-mix(in srgb,var(--late) 13%,transparent)}
.chip.plan{color:var(--plan);background:color-mix(in srgb,var(--plan) 13%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.bar{position:relative;display:block;height:10px;border-radius:99px;background:var(--track)}
.bar i{position:absolute;inset:0 auto 0 0;width:var(--a);background:var(--act);border-radius:inherit}
.bar u{position:absolute;top:-4px;bottom:-4px;left:var(--p);width:2px;margin-left:-1px;background:var(--plan);border-radius:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:0;border-top:2.5px solid}
.sw.plan{border-color:var(--plan)}
.sw.act{border-color:var(--act)}
.sw.fc{border-color:var(--act);border-top-style:dashed}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.demo-note{font-size:12.5px;color:var(--muted)}

/* Portfolio */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{padding:16px 22px;border-left:1px solid var(--stroke)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:34px;font-stretch:68%;font-weight:800;line-height:1}
.stat span{color:var(--muted);font-size:13.5px}
.stat.late b{color:var(--late)} .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)}
.sites{overflow:hidden}
.sites-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 22px 12px}
.site{
  display:grid;grid-template-columns:minmax(170px,1.3fr) minmax(150px,1.1fr) minmax(190px,1.5fr) 130px 104px;
  align-items:center;gap:18px;padding:15px 22px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--stroke);color:inherit;font:inherit;cursor:pointer;
}
.site:hover{background:var(--glass-strong)}
.site small{display:block;color:var(--muted);font-size:12.5px}
.site-name b{font-size:16px;font-weight:700}
.site-prog small{margin-top:7px}
.site.featured{box-shadow:inset 3px 0 0 var(--act)}

/* Project hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.hero-main{padding:24px 26px;border-right:1px solid var(--stroke)}
.hero-num{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero-num b{font-size:clamp(76px,11vw,136px);font-stretch:62%;font-weight:820;line-height:.86;color:var(--late);letter-spacing:-.01em}
.hero-num span{font-size:clamp(22px,2.4vw,30px);font-stretch:85%;font-weight:700;line-height:1.1}
.hero-main p{margin:16px 0 0;max-width:52ch;color:var(--muted)}
.hero-main p strong{color:var(--text);font-weight:650}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:0}
.facts div{padding:16px 22px;border-top:1px solid var(--stroke)}
.facts div:nth-child(-n+2){border-top:0}
.facts div:nth-child(odd){border-right:1px solid var(--stroke)}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:2px 0 0;font-size:20px;font-stretch:86%;font-weight:700;line-height:1.2}
.facts dd small{display:block;font-size:13px;font-stretch:100%;font-weight:500;color:var(--muted)}
.facts .bar{margin-top:8px}

/* Tower */
.tower{display:grid;grid-template-columns:132px repeat(7,minmax(58px,1fr));gap:6px;min-width:640px}
.tower .th{font-size:12.5px;color:var(--muted);font-weight:600;align-self:end;padding-bottom:2px;line-height:1.2}
.floor{display:flex;flex-direction:column;justify-content:center;font-weight:650;font-size:14px;line-height:1.2;min-height:42px}
.tags{display:flex;gap:4px;margin-top:3px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;line-height:1.4}
.tag.plan{color:var(--plan);border:1px solid var(--plan)}
.tag.act{color:var(--on-act);background:var(--act)}
.cell{position:relative;min-height:42px;border-radius:8px;background:var(--track);display:grid;place-items:center;font-size:12.5px;font-weight:680;overflow:hidden;cursor:default}
.cell::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--f,0%);transition:width .7s cubic-bezier(.2,.7,.2,1) var(--dly,0s)}
.cell.done::before{background:color-mix(in srgb,var(--ok) 42%,transparent)}
.cell.active::before{background:color-mix(in srgb,var(--act) 55%,transparent)}
.cell.behind{box-shadow:inset 0 0 0 1.5px var(--late)}
.cell.behind::before{background:color-mix(in srgb,var(--act) 55%,transparent)}
.cell.none{background:transparent;border:1px dashed var(--stroke)}
.cell span{position:relative}
.tower.pre .cell::before{width:0}

/* Milestones */
.ms{list-style:none;padding:0;margin:0}
.ms li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:9px 0;position:relative;align-items:start}
.ms li::before{content:"";position:absolute;left:10px;top:28px;bottom:-10px;width:2px;background:var(--stroke)}
.ms li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--stroke);background:var(--glass-strong);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.ms li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.ms li.next .dot{border-color:var(--act);box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 25%,transparent)}
.ms b{font-weight:650;display:block;line-height:1.3}
.ms small{color:var(--muted);font-size:13px}
.ms .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Delay reasons */
.reason{display:grid;grid-template-columns:150px minmax(0,1fr) 46px;align-items:center;gap:12px;margin:9px 0;font-size:14px}
.reason .bar i{background:var(--late)}
.reason b{text-align:right;font-weight:700}
.log{list-style:none;margin:16px 0 0;padding:0;max-height:300px;overflow:auto}
.log li{padding:11px 0;border-top:1px solid var(--stroke);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.log .meta{color:var(--muted);font-size:12.5px}
.log p{margin:0;font-size:14px}

/* Gantt */
.gantt{min-width:860px;position:relative}
.g-row{display:grid;grid-template-columns:270px minmax(0,1fr);align-items:center;min-height:30px;border-top:1px solid var(--stroke)}
.g-head{border-top:0;min-height:26px}
.g-label{font-size:13.5px;padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label.l2{font-weight:760;font-stretch:90%;font-size:14px}
.g-label.l3{padding-left:14px;color:var(--muted)}
.g-track{position:relative;height:30px}
.g-head .g-track{height:26px}
.g-month{position:absolute;top:4px;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-left:4px;border-left:1px solid var(--stroke);height:22px}
.g-plan{position:absolute;top:6px;height:8px;border:1.5px solid var(--plan);border-radius:4px;background:color-mix(in srgb,var(--plan) 14%,transparent)}
.g-act{position:absolute;top:16px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,var(--act) var(--p),transparent var(--p)),
             repeating-linear-gradient(45deg,color-mix(in srgb,var(--act) 50%,transparent) 0 3px,transparent 3px 6px)}
.g-row.l2row{background:color-mix(in srgb,var(--plan) 6%,transparent)}
.g-today{position:absolute;top:0;bottom:0;left:calc(270px + (100% - 270px) * var(--t));width:2px;background:var(--late);opacity:.85;pointer-events:none}
.g-today span{position:absolute;top:-2px;left:6px;font-size:11px;font-weight:700;color:var(--late);white-space:nowrap}

/* Updates & crew */
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:13px 0;border-top:1px solid var(--stroke)}
.feed li:first-child{border-top:0;padding-top:4px}
.feed .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.feed p{margin:4px 0 0;max-width:70ch}
.feed .crew{font-weight:650;color:var(--text)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}

/* Schedule */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--track);gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search{flex:1;min-width:200px;max-width:340px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{text-align:left;font-weight:620;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--stroke)}
td{padding:9px 10px;border-top:1px solid var(--stroke);vertical-align:middle}
tr.l1 td{font-weight:800;font-stretch:88%;font-size:15px}
tr.l2 td{font-weight:740;background:color-mix(in srgb,var(--plan) 7%,transparent)}
tr.l3 td{font-weight:640}
td.name small{display:block;color:var(--muted);font-weight:450;font-size:12.5px}
td .id{color:var(--muted);font-size:12px;margin-right:8px;font-weight:500}
td.dates{white-space:nowrap}
td.dates.fc{color:var(--muted);font-style:italic}
.minibar{display:flex;align-items:center;gap:8px;min-width:120px}
.minibar .bar{flex:1;height:7px}
.minibar span{width:38px;text-align:right;font-size:13px}
.ms-star{color:var(--act);margin-right:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Forms */
.phone{max-width:480px;width:100%;margin:0 auto}
.field{margin-top:16px}
.field > label,.field > .label{display:block;font-weight:620;font-size:14px;margin-bottom:6px}
input,select,textarea{
  width:100%;font:inherit;color:var(--text);background:var(--glass-strong);
  border:1px solid var(--stroke);border-radius:12px;padding:11px 12px;
}
textarea{min-height:84px;resize:vertical}
input[type="range"]{padding:0;background:none;border:0;accent-color:var(--act)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range-head{display:flex;justify-content:space-between;align-items:baseline}
.range-head output{font-size:26px;font-stretch:70%;font-weight:800}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{position:relative}
.choices input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choices span{display:inline-block;padding:8px 13px;border-radius:99px;border:1px solid var(--stroke);background:var(--glass-strong);font-size:14px;font-weight:600}
.choices input:checked + span{background:var(--late);border-color:var(--late);color:#fff}
.choices input:focus-visible + span{outline:2px solid var(--plan);outline-offset:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--stroke);border-radius:12px;background:var(--glass-strong);cursor:pointer}
.switch input{width:44px;height:26px;appearance:none;border-radius:99px;background:var(--track);border:1px solid var(--stroke);position:relative;cursor:pointer;padding:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked{background:var(--late);border-color:var(--late)}
.switch input:checked::after{left:20px}
.delay-box{display:none;padding:14px;margin-top:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--late) 40%,transparent);background:color-mix(in srgb,var(--late) 6%,transparent)}
.delay-box.open{display:block}
.photo{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border:1.5px dashed var(--stroke);border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;background:var(--glass)}
.form-actions{display:flex;gap:10px;margin-top:22px}
.form-actions .btn{flex:1;justify-content:center}
.drop{display:block;padding:24px;border:1.5px dashed color-mix(in srgb,var(--plan) 55%,transparent);border-radius:14px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--plan) 6%,transparent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{display:block;font-size:15px}
.drop small{color:var(--muted)}
.drop.has b{color:var(--ok)}
.phase{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--stroke)}
.phase:first-of-type{border-top:0}
.phase small{color:var(--muted);font-size:13px}
.big-date{font-size:40px;font-stretch:66%;font-weight:820;line-height:1}

/* ---------- Motion ---------- */
.backdrop{overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(50px);animation:drift 24s ease-in-out infinite alternate}
.o1{width:360px;height:360px;top:6%;left:52%;background:var(--act);opacity:.22}
.o2{width:460px;height:460px;bottom:-12%;left:-6%;background:var(--plan);opacity:.28;animation-duration:30s}
.o3{width:280px;height:280px;top:48%;right:-6%;background:#4FD1C5;opacity:.16;animation-duration:20s}
@keyframes drift{to{transform:translate(70px,-50px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fillx{from{transform:scaleX(0)}}

#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease,visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.splash-in svg{width:88px;height:88px}
.splash-in .sb{transform-box:fill-box;transform-origin:bottom;animation:barUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes barUp{from{transform:scaleY(0)}}
.splash-in b{font-size:30px;font-stretch:72%;font-weight:820;letter-spacing:-.01em;animation:rise .7s .35s both}
.splash-in span{color:var(--muted);font-size:14px;animation:rise .7s .5s both}
.splash-line{width:170px;height:3px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:6px}
.splash-line i{display:block;height:100%;background:var(--act);animation:load 1.3s ease-in-out both}
@keyframes load{from{width:0}to{width:100%}}

main > *{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0) * 80ms)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.bar i{transform-origin:left;animation:fillx 1.1s cubic-bezier(.2,.8,.2,1) .25s backwards}
.bar u{animation:fadeIn .4s 1s backwards}
.g-plan,.g-act{transform-origin:left;animation:fillx .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 22ms + .2s)}
.g-act{animation-delay:calc(var(--i,0) * 22ms + .45s)}
.g-today{animation:fadeIn .5s 1.2s backwards}
svg .draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.4,0,.2,1) backwards}
svg .draw.d2{animation-delay:.5s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
svg .late-in{animation:fadeIn .8s 1.8s backwards}
svg .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.6)}}
.ms li.next .dot{animation:ring 1.8s infinite}
@keyframes ring{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--act) 12%,transparent)}}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out 2s infinite;pointer-events:none}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.site{transition:background .2s,transform .25s}
.site:hover{transform:translateX(5px)}
.glass.panel{transition:transform .3s,box-shadow .3s}
.glass.panel:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(16,35,63,.14)}

/* Intro hero */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;overflow:hidden}
.intro-copy{padding:40px 8px 40px 38px}
.intro h1{font-size:clamp(42px,5.6vw,76px);font-stretch:70%;font-weight:830;line-height:.94;letter-spacing:-.015em;margin-top:14px}
.intro h1 span{display:block;animation:rise .8s cubic-bezier(.2,.8,.2,1) .15s backwards}
.intro h1 span:nth-child(2){animation-delay:.3s}
.intro h1 span:nth-child(3){animation-delay:.45s;color:var(--act)}
.intro .sub{font-size:16.5px;margin-top:18px;animation:rise .8s .6s backwards}
.intro .actions{margin-top:24px;animation:rise .8s .72s backwards}
.ticks{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;animation:rise .8s .85s backwards}
.tick{padding:10px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--stroke)}
.tick b{display:block;font-size:26px;font-stretch:68%;font-weight:830;line-height:1}
.tick span{font-size:12.5px;color:var(--muted)}
.intro-art{align-self:stretch;display:flex;align-items:flex-end;padding:18px 18px 0 0}
.intro-art svg{width:100%;height:auto;display:block}
.scene text{font-family:inherit;font-size:11px;fill:var(--muted);font-weight:650}
.scene .fl{transform-box:fill-box;animation:floorIn .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d)}
@keyframes floorIn{from{opacity:0;transform:translateY(-30px)}}
.scene .ghost{animation:fadeIn 1s backwards;animation-delay:var(--d)}
.scene .ghost rect{stroke-dasharray:5 4;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.scene .win{animation:lit 5s ease-in-out infinite;animation-delay:var(--w)}
@keyframes lit{0%,40%,100%{fill-opacity:.22}50%,85%{fill-opacity:.95}}
.scene .trolley{animation:trolley 9s ease-in-out infinite}
@keyframes trolley{0%,18%{transform:translateX(440px)}42%,72%{transform:translateX(292px)}92%,100%{transform:translateX(440px)}}
.scene .hook{animation:hook 9s ease-in-out infinite}
@keyframes hook{0%{transform:translateY(272px)}18%,42%{transform:translateY(14px)}58%,66%{transform:translateY(118px)}80%,92%{transform:translateY(14px)}100%{transform:translateY(272px)}}
.scene .cable{transform-box:fill-box;transform-origin:50% 0;animation:cable 9s ease-in-out infinite}
@keyframes cable{0%{transform:scaleY(272)}18%,42%{transform:scaleY(14)}58%,66%{transform:scaleY(118)}80%,92%{transform:scaleY(14)}100%{transform:scaleY(272)}}
.scene .beacon{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.scene .cloud{animation:cloud 46s linear infinite}
.scene .cloud.c2{animation-duration:64s;animation-delay:-30s}
@keyframes cloud{from{transform:translateX(-140px)}to{transform:translateX(640px)}}
.scene .sun{transform-box:fill-box;transform-origin:center;animation:sunp 6s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.1)}}
.scene .shutter{animation:shut 1.6s ease-in-out infinite}
@keyframes shut{50%{opacity:.35}}
.scene .marker{animation:fadeIn .8s 1.5s backwards}
.scene .scan{animation:scan 5s ease-in-out 1.2s infinite}
@keyframes scan{0%{transform:translateY(336px);opacity:0}12%,88%{opacity:.9}100%{transform:translateY(186px);opacity:0}}

.ticker{overflow:hidden;padding:13px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.ticker-track{display:flex;gap:44px;padding-right:44px;width:max-content;animation:tick 50s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-size:14px;color:var(--muted)}
.ticker-item b{font-weight:700;color:var(--text)}
.ticker-item::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--act);border-radius:2px;flex:none}
@keyframes tick{to{transform:translateX(-50%)}}
@media (max-width:1180px){
  .intro{grid-template-columns:minmax(0,1fr)}
  .intro-art{padding:0 16px}
}
@media (max-width:900px){
  .intro-copy{padding:26px 20px 6px}
  .intro-art{padding:0 6px}
}

/* Page heroes & looping illustrations */
.page-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);align-items:center;overflow:hidden}
.page-hero .copy{padding:30px 32px}
.page-hero h1{font-size:clamp(36px,4.6vw,58px);font-stretch:72%;font-weight:830;line-height:.96;animation:rise .7s .1s backwards}
.page-hero .sub{animation:rise .7s .25s backwards}
.page-hero .art{padding:16px 22px 16px 0}
.page-hero .art svg{width:100%;height:auto;display:block;max-height:250px}
.art text,.road text{font-family:inherit;font-size:11.5px;fill:var(--muted);font-weight:650}
.road{width:100%;height:auto;display:block}
@media (max-width:1180px){.page-hero{grid-template-columns:minmax(0,1fr)}.page-hero .art{padding:0 18px 16px}}
@media (max-width:900px){.page-hero .copy{padding:22px 18px 8px}}
.bp{fill:none;stroke:var(--plan);stroke-width:1.6;stroke-dasharray:1;animation:bpdraw 7s ease-in-out infinite}
@keyframes bpdraw{0%{stroke-dashoffset:1;opacity:1}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.lbar{transform-box:fill-box;transform-origin:left;animation:lbar 6s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:var(--d,0s)}
@keyframes lbar{0%{transform:scaleX(0);opacity:1}25%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.tickc{stroke-dasharray:1;animation:tickc 4.8s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes tickc{0%,10%{stroke-dashoffset:1;opacity:1}25%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.arc{animation:arc 2s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes arc{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.packet{animation:packet 2.4s linear infinite;animation-delay:var(--d,0s)}
@keyframes packet{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(92px);opacity:0}}
.badge{transform-box:fill-box;transform-origin:center;animation:badge 2.4s ease-in-out infinite}
@keyframes badge{0%,60%,100%{transform:scale(1)}72%{transform:scale(1.4)}}
.rowscan{animation:rowscan 4.2s steps(6) infinite}
@keyframes rowscan{from{transform:translateY(0)}to{transform:translateY(132px)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
.flowline{stroke-dasharray:6 6;animation:march2 .8s linear infinite}
@keyframes march2{to{stroke-dashoffset:-12}}
.glow,.blink-line{animation:shut 1.8s ease-in-out infinite}
.art .win{animation:lit 5s ease-in-out infinite;animation-delay:var(--w)}
.road-dash{stroke-dasharray:22 18;animation:roadm 1.6s linear infinite}
@keyframes roadm{to{stroke-dashoffset:-40}}
.truck{animation:driveIn 2.6s cubic-bezier(.25,.7,.25,1) .4s backwards}
@keyframes driveIn{from{transform:translateX(-170px)}}
.truck-body{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear .4s 6}
@keyframes spin{to{transform:rotate(360deg)}}
.stripes{animation:stripes .55s linear infinite}
@keyframes stripes{to{transform:translateX(14px)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(-14px,-22px) scale(1.7);opacity:0}}
.pin{animation:pinDrop .7s cubic-bezier(.3,1.5,.5,1) 2.4s backwards}
@keyframes pinDrop{from{transform:translateY(-44px);opacity:0}}
.gap,.gap-label{animation:fadeIn .6s 3s backwards,gapPulse 1.8s ease-in-out 3.6s infinite}
@keyframes gapPulse{50%{opacity:.4}}
.flag{transform-box:fill-box;transform-origin:left center;animation:wave 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes wave{50%{transform:skewY(-9deg) scaleX(.9)}}

/* Live detail */
.cell span{z-index:1}
.cell.active::after,.cell.behind::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--f,0%);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);background-size:14.14px 14.14px;animation:hazard 1s linear infinite}
@keyframes hazard{to{background-position:14.14px 0}}
.cell.behind{animation:warnPulse 2s ease-in-out infinite}
@keyframes warnPulse{50%{box-shadow:inset 0 0 0 1.5px var(--late),0 0 0 4px color-mix(in srgb,var(--late) 18%,transparent)}}
.chip.late::before{animation:shut 1.3s ease-in-out infinite}
.feed > li,.log > li,.ms > li,.phase{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 80ms + .3s)}
tbody tr{animation:fadeIn .5s backwards;animation-delay:calc(var(--i,0) * 18ms)}
.big-date{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}

/* Success burst */
.celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .25s;transition:opacity .35s}
.celebrate.out{opacity:0}
.cel-card{position:relative;padding:28px 36px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.cel-card b{font-size:18px;font-weight:720}
.cel-card svg{width:88px;height:88px}
.cel-ring{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:1;animation:draw .6s ease-out backwards}
.cel-tick{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw .4s .45s ease-out backwards}
.confetti{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:2px;background:var(--c);animation:burst 1.3s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}

/* Animated background on every page */
.beam{position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--plan) 12%,transparent),transparent);transform:rotate(20deg);animation:beam 16s ease-in-out infinite}
@keyframes beam{0%{transform:translateX(0) rotate(20deg)}60%,100%{transform:translateX(430%) rotate(20deg)}}
.bp-shape{position:absolute;opacity:.3;animation:spinSlow 90s linear infinite}
.bp-shape.s1{width:320px;height:320px;top:-70px;left:-70px}
.bp-shape.s2{width:230px;height:230px;top:34%;right:-60px;animation-direction:reverse;animation-duration:70s}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.mote{position:absolute;bottom:-20px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:0;animation:mote var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes mote{0%{transform:translate(0,0);opacity:0}10%{opacity:.6}90%{opacity:.45}100%{transform:translate(var(--dx),-105vh);opacity:0}}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:250px;opacity:.85}
.skyline .jib{transform-box:view-box;animation:jibswing var(--jd) ease-in-out infinite alternate}
@keyframes jibswing{0%{transform:scaleX(1)}100%{transform:scaleX(-.65)}}
.skyline .bwin{animation:lit 6s ease-in-out infinite;animation-delay:var(--w)}
.skyline .beacon{animation:blink 1.4s steps(2) infinite}
.skyline .rise-fl{transform-box:fill-box;animation:risefl 16s ease-in-out infinite;animation-delay:var(--d)}
@keyframes risefl{0%{opacity:0;transform:translateY(-10px)}6%{opacity:1;transform:none}70%{opacity:1}80%,100%{opacity:0}}
@media (max-width:900px){.skyline{height:170px}.bp-shape.s1{width:220px;height:220px}}

/* ---------- Login ---------- */
body.auth .side,body.auth .bottomnav{display:none}
body.auth .app{grid-template-columns:minmax(0,1fr)}
.auth-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);gap:20px;min-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.auth-card{align-self:center;justify-self:center;width:100%;max-width:450px;padding:34px 34px 28px}
.auth-title{font-size:clamp(34px,3.6vw,46px);font-stretch:74%;font-weight:820;line-height:1}
.role-seg{display:flex;width:100%}
.role-seg button{flex:1}
.pw{position:relative}
.pw input{padding-right:72px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:var(--track);color:var(--text);font:inherit;font-size:13px;font-weight:650;padding:6px 10px;border-radius:8px;cursor:pointer}
.err{display:none;color:var(--late);font-size:13px;margin:6px 0 0}

.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}

.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.auth-card .brand,.auth-card .auth-title,.auth-card .sub,.auth-card form{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.auth-card .auth-title{animation-delay:.1s}.auth-card .sub{animation-delay:.2s}.auth-card form{animation-delay:.3s}

.fly-cap{display:grid;margin-top:14px;max-width:46ch}
.fly-cap span{grid-area:1 / 1;color:rgba(255,255,255,.88);font-size:15.5px}
.cap-a{animation:capA 12s linear infinite}
.cap-b{opacity:0;animation:capB 12s linear infinite}
.cap-c{opacity:0;animation:capC 12s linear infinite}
@keyframes capA{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
@keyframes capB{0%,46%{opacity:0}50%,76%{opacity:1}80%,100%{opacity:0}}
@keyframes capC{0%,76%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}

.fly-steps div{font-size:12.5px;font-weight:650;color:rgba(255,255,255,.85)}
.fly-steps i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden;position:relative}
.fly-steps i::after{content:"";position:absolute;inset:0;background:#FFB020;transform-origin:left;animation:var(--an) 12s linear infinite}

function frac(a, b, d){ if (d < a) return 0; if (d >= b) return 1; return (d - a + 1) / (b - a + 1); }

const TODAY = D("20-04-27");
const START = D("31-10-26"), END = D("31-01-28");
const DELAY_PTS = [[D("31-10-26"),0],[D("15-12-26"),3],[D("24-01-27"),5],[D("05-03-27"),7],[D("14-04-27"),9]];
function delayAt(d){
  if (d <= DELAY_PTS[0][0]) return 0;
  for (let i = 1; i < DELAY_PTS.length; i++){
    const [a,da] = DELAY_PTS[i-1], [b,db] = DELAY_PTS[i];
    if (d <= b) return da + (db - da) * (d - a) / (b - a);
  }
  return DELAY_PTS[DELAY_PTS.length - 1][1];
}

/* ---------- Build task model ---------- */
const TASKS = RAW.trim().split("\n").map(l => {
  const [id, lv, name, s, f] = l.split("|");
  return { id:+id, lv:+lv, name, s:D(s), f:D(f) };
});
const BY_ID = {};
(function build(){
  const stack = [];
  TASKS.forEach((t, i) => {
    BY_ID[t.id] = t;
    const n = TASKS[i + 1];
    t.leaf = !n || n.lv <= t.lv;
    t.ms = MILESTONE_IDS.has(t.id);
    t.dur = t.f - t.s + 1;
    while (stack.length && stack[stack.length - 1].lv >= t.lv) stack.pop();
    t.parent = stack[stack.length - 1] || null;
    stack.push(t);
  });
  TASKS.filter(t => t.leaf).forEach(t => {
    t.as = t.s + Math.round(delayAt(t.s));
    t.af = Math.max(t.as, t.f + Math.round(delayAt(t.f)));
    t.pPlan = frac(t.s, t.f, TODAY);
    t.pAct = frac(t.as, t.af, TODAY);
    let p = t.parent;
    while (p){ (p.kids = p.kids || []).push(t); p = p.parent; }
  });
  TASKS.filter(t => !t.leaf).forEach(t => {
    let W = 0, pp = 0, pa = 0, as = Infinity, af = -Infinity;
    t.kids.forEach(k => { W += k.dur; pp += k.dur * k.pPlan; pa += k.dur * k.pAct; as = Math.min(as, k.as); af = Math.max(af, k.af); });
    t.pPlan = pp / W; t.pAct = pa / W; t.as = as; t.af = af;
  });
})();
const PROJECT = TASKS[0];
const LEAVES = PROJECT.kids;
const W_ALL = LEAVES.reduce((s, k) => s + k.dur, 0);
const planAt = d => LEAVES.reduce((s, k) => s + k.dur * frac(k.s, k.f, d), 0) / W_ALL;
const actAt  = d => LEAVES.reduce((s, k) => s + k.dur * frac(k.as, k.af, d), 0) / W_ALL;
const CUR_DELAY = Math.round(delayAt(TODAY));
const FORECAST_END = END + CUR_DELAY;

}

}

  for (let d = x0; d < END; d += 7) plan.push([d, planAt(d)]); plan.push([END, 1]);
  for (let d = x0; d < TODAY; d += 7) act.push([d, actAt(d)]); act.push([TODAY, actAt(TODAY)]);

function ganttHTML(){
  const x0 = START, x1 = END + 14, span = x1 - x0 + 1;
  const pos = d => ((d - x0) / span * 100).toFixed(3);
  const wid = (a,b) => ((b - a + 1) / span * 100).toFixed(3);
  let months = "";
  for (let y = 2026, m = 10; y < 2028 || (y === 2028 && m <= 1); m++){
    if (m > 11){ m = 0; y++; }
    const d = Math.round(Date.UTC(y, m, 1) / 864e5);
    if (d >= x0 && d <= x1){
      const label = m === 0 ? `Jan ’${String(y).slice(2)}` : MON[m];
      months += `<span class="g-month" style="left:${pos(d)}%">${label}</span>`;
    }
    if (y === 2028 && m === 1) break;
  }
  const rows = TASKS.filter(t => t.lv === 2 || t.lv === 3).map((t, idx) => {
    const p = Math.round(t.pAct * 100);
    const tip = `${t.name}: planned ${fmt(t.s)} to ${fmt(t.f)}, actual or forecast ${fmt(t.as)} to ${fmt(t.af)}, ${p}% done`;
    return `<div class="g-row ${t.lv===2?"l2row":""}" style="--i:${idx}" title="${esc(tip)}">
      <div class="g-label l${t.lv}">${esc(t.name)}</div>
      <div class="g-track">
        <span class="g-plan" style="left:${pos(t.s)}%;width:${wid(t.s,t.f)}%"></span>
        <span class="g-act" style="left:${pos(t.as)}%;width:${wid(t.as,t.af)}%;--p:${p}%"></span>
      </div>
    </div>`;
  }).join("");
  return `<div class="gantt" style="--t:${((TODAY - x0) / span).toFixed(4)}">
    <div class="g-row g-head"><div class="g-label"></div><div class="g-track">${months}</div></div>
    ${rows}
    <div class="g-today"><span>Today</span></div>
  </div>`;
}

function crewSVG(){
  const W = 640, H = 170, L = 30, B = 24, TP = 10, n = CREW.length;
  const bw = (W - L - 8) / n;
  const Y = v => TP + (1 - v / 100) * (H - TP - B);
  let g = "";
  [0,50,100].forEach(v => { g += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--stroke)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`; });
  CREW.forEach((v,i) => {
    const x = L + 4 + i * bw;
    const d = TODAY - (n - 1 - i);
    g += `<rect x="${x+3}" y="${Y(85)}" width="${bw-6}" height="${Y(0)-Y(85)}" rx="4" fill="none" stroke="var(--plan)" stroke-width="1.2" stroke-dasharray="3 2"/>`;
    g += `<rect x="${x+6}" y="${Y(v)}" width="${bw-12}" height="${Y(0)-Y(v)}" rx="3" fill="var(--act)"><title>${fmt(d)}: ${v} of 85 workers</title></rect>`;
    if (i % 2 === 1 || i === n - 1) g += `<text x="${x + bw/2}" y="${H-6}" text-anchor="middle">${fmt(d,true)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Workers on site against planned crew for the last two weeks">${g}</svg>`;
}

let schedFilter = "all", schedQuery = "";
function scheduleRows(){
  const q = schedQuery.trim().toLowerCase();
  let list = TASKS;
  if (schedFilter !== "all" || q){
    list = TASKS.filter(t => t.leaf);
    if (schedFilter === "active") list = list.filter(t => t.pAct > 0 && t.pAct < 1);
    if (schedFilter === "behind") list = list.filter(isBehind);
    if (schedFilter === "ms") list = list.filter(t => t.ms);
    if (q) list = list.filter(t => (t.name + " " + contextName(t)).toLowerCase().includes(q));
  }
  if (!list.length) return `<tr><td colspan="6" class="empty">No activities match. Try another filter or search term.</td></tr>`;
  const flat = schedFilter !== "all" || q;
  return list.map((t, rowI) => {
    const st = status(t);
    const v = t.af - t.f;
    const future = st === "upcoming" || st === "late-start";
    let chip;
    if (st === "done") chip = v > 0 ? `<span class="chip late">+${v} d</span>` : `<span class="chip ok">On time</span>`;
    else if (v > 0) chip = `<span class="chip warn">+${v} d forecast</span>`;
    else chip = `<span class="chip ok">On time</span>`;
    const ctx = flat && contextName(t) ? `<small>${esc(contextName(t))}</small>` : "";
    const indent = flat ? 0 : Math.max(0, t.lv - 2) * 16;
    const p = Math.round(t.pAct * 100);
    return `<tr class="l${flat ? 4 : t.lv}" style="--i:${Math.min(rowI, 45)}">
      <td class="name" style="padding-left:${10 + indent}px"><span class="id">${t.id}</span>${t.ms ? '<span class="ms-star" title="Milestone">◆</span>' : ""}${esc(t.name)}${ctx}</td>
      <td class="dates">${fmt(t.s)} – ${fmt(t.f)}</td>
      <td class="dates ${future ? "fc" : ""}" title="${future ? "Forecast" : "Actual"}">${fmt(t.as)} – ${fmt(t.af)}</td>

      <td>${chip}</td>
    </tr>`;
  }).join("");
}

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateCounts(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, dec = +(el.dataset.dec || 0), suf = el.dataset.suffix || "";
    if (REDUCED){ el.textContent = to.toFixed(dec) + suf; return; }
    const t0 = performance.now() + 250, dur = 1400;
    const step = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (to * e).toFixed(dec) + suf;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

  ${fw}
  ${tile("px1", far)}

  <g class="ghostb" fill="none" stroke="#7fb2e5" stroke-width="1.4"><rect x="440" y="220" width="170" height="240"/><rect x="490" y="196" width="70" height="24"/></g>

  ${floors}

  <g class="crane">

    <g class="cjib" style="transform-origin:682px 140px">

    <div class="brand" style="padding:0 0 22px">

      <div class="field" id="passField"><label for="lgPass">Password</label><div class="pw"><input id="lgPass" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" id="pwToggle" aria-label="Show password">Show</button></div><p class="err">Enter your password.</p></div>
      <div class="row-between"><label class="check"><input type="checkbox" id="rememberMe" checked>Keep me signed in</label><a href="#login" id="forgotLink">Forgot password?</a></div>

/* ---------- Router ---------- */
const VIEWS = {login:viewLogin, portfolio:viewPortfolio, project:viewProject, schedule:viewSchedule, update:viewUpdate, new:viewNew};
function route(){
  let key = (location.hash || "").replace("#","");
  if (!VIEWS[key]) key = location.hash ? "portfolio" : "login";
  document.body.classList.toggle("auth", key === "login");
  renderNav(key);
  const v = $("#view");
  v.innerHTML = VIEWS[key]();
  Array.from(v.children).forEach((c, i) => c.style.setProperty("--n", i));
  window.scrollTo(0,0);
  bind(key);
  animateCounts(v);
  v.querySelectorAll(".feed, .log, .ms").forEach(list => Array.from(list.children).forEach((c, i) => c.style.setProperty("--i", i)));
}
function bind(key){
  document.querySelectorAll("[data-print]").forEach(b => b.addEventListener("click", printPage));
  if (key === "login"){
    let role = "owner";
    document.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => {
      role = b.dataset.role;
      document.querySelectorAll("[data-role]").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    $("#pwToggle").addEventListener("click", () => {
      const p = $("#lgPass"), show = p.type === "password";
      p.type = show ? "text" : "password";
      $("#pwToggle").textContent = show ? "Hide" : "Show";
      $("#pwToggle").setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
    $("#forgotLink").addEventListener("click", e => { e.preventDefault(); toast("Demo: a password reset link would be emailed to you."); });
    $("#ssoBtn").addEventListener("click", () => toast("Demo: company single sign-on connects in the full version."));
    ["lgEmail","lgPass"].forEach(id => $("#" + id).addEventListener("input", e => e.target.closest(".field").classList.remove("invalid")));
    $("#loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const em = $("#lgEmail"), pw = $("#lgPass");
      const badE = !em.value.trim(), badP = !pw.value.trim();
      $("#emailField").classList.toggle("invalid", badE);
      $("#passField").classList.toggle("invalid", badP);
      if (badE || badP){ (badE ? em : pw).focus(); return; }
      const btn = $("#signInBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in';
      setTimeout(() => {
        location.hash = role === "planning" ? "schedule" : role === "site" ? "update" : "portfolio";
        toast("Signed in. Welcome back.");
      }, REDUCED ? 200 : 1100);
    });
  }
  if (key === "portfolio"){
    document.querySelectorAll("[data-site]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.site === "eden") location.hash = "project";
      else toast("Sample site. Open Morais Eden to see the full drill-down.");
    }));
  }
  if (key === "project"){
    const tw = $("#tower");
    requestAnimationFrame(() => requestAnimationFrame(() => tw && tw.classList.remove("pre")));
  }
  if (key === "schedule"){
    document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
      schedFilter = b.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#schedBody").innerHTML = scheduleRows();
    }));
    $("#schedSearch").addEventListener("input", e => { schedQuery = e.target.value; $("#schedBody").innerHTML = scheduleRows(); });
  }
  if (key === "update"){
    const sel = $("#updTask"), rng = $("#updProg"), out = $("#updOut");
    const syncTask = () => { const t = BY_ID[sel.value]; rng.value = Math.round(t.pAct * 20) * 5; out.textContent = rng.value + "%"; };
    sel.addEventListener("change", syncTask); syncTask();
    rng.addEventListener("input", () => out.textContent = rng.value + "%");
    $("#delayToggle").addEventListener("change", e => $("#delayBox").classList.toggle("open", e.target.checked));
    $("#updPhoto").addEventListener("change", e => { const n = e.target.files.length; $("#photoTxt").textContent = n ? plural(n,"photo") + " added" : "Add site photos"; });
    $("#updForm").addEventListener("submit", e => {
      e.preventDefault();
      const t = BY_ID[sel.value];
      const plan = +$("#crewPlan").value || 0, act = +$("#crewAct").value || 0;
      const note = $("#updNote").value.trim();
      const label = t.name + (contextName(t) ? " (" + contextName(t) + ")" : "");
      UPDATES.unshift({d:TODAY, who:"You, site engineer", text:`${label}: ${rng.value}% done.${note ? " " + note : ""}`, crew:[plan, act]});
      if ($("#delayToggle").checked){
        const cat = (document.querySelector('input[name="cat"]:checked') || {}).value || "Weather";
        DELAYS.unshift({d:TODAY, task:label, cat, days:+$("#delayDays").value || 1, note: note || "Reason recorded from the site update."});
      }
      celebrate("Update posted to Morais Eden", () => { location.hash = "project"; });
    });
  }
  if (key === "new"){
    const pv = $("#npPreview");
    const draw = () => pv.innerHTML = previewHTML();
    draw();
    $("#npStart").addEventListener("input", draw);
    $("#npFile").addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      $("#drop").classList.add("has");
      $("#dropTitle").textContent = f.name + " selected";
      $("#dropSub").textContent = "Demo: the standard template is used for the preview. Import will read this file in the full version.";
    });
    $("#newForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("#npName").value.trim();
      if (!name){ $("#npName").focus(); toast("Enter a project name to create the project."); return; }
      const s = fromISO($("#npStart").value || "2027-06-01");
      const end = END + (s - START);
      const d = new Date(end * 864e5);
      SITES.push({id:"p" + Date.now(), name, type:$("#npType").value || "Stilt + 5 floors", planned:0, actual:0, delay:0,
        stage:"Starts " + fmt(s), handover: MON[d.getUTCMonth()] + " " + d.getUTCFullYear(), upcoming:true});
      celebrate(name + " created with " + LEAVES.length + " activities", () => { location.hash = "portfolio"; });
    });
  }
}

/* ---------- Theme ---------- */
(function theme(){
  const root = document.documentElement;
  try { const saved = localStorage.getItem("pm-theme"); if (saved) root.dataset.theme = saved; } catch(e){}
  document.addEventListener("click", e => {
    if (!e.target.closest("[data-theme-toggle]")) return;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("pm-theme", root.dataset.theme); } catch(e){}
  });
})();

/* ---------- Animated backdrop (shared by every page) ---------- */
(function buildBackdrop(){
  const host = document.querySelector(".backdrop");
  if (!host) return;
  host.insertAdjacentHTML("afterbegin", '<div class="bg-grid"></div>');
  let m = "";
  for (let i = 0; i < 24; i++){
    const left = (i * 37 + 11) % 100, sz = 3 + (i % 4), dur = 18 + (i * 7) % 16, delay = -((i * 5.3) % dur), dx = (i % 2 ? 1 : -1) * (20 + (i * 13) % 60);
    m += `<span class="mote" style="left:${left}%;--s:${sz}px;--dur:${dur}s;--delay:${delay.toFixed(1)}s;--dx:${dx}px;--c:${i % 3 ? "var(--plan)" : "var(--act)"}"></span>`;
  }
  const fill = a => `style="fill:color-mix(in srgb,var(--plan) ${a}%,transparent)"`;
  let sk = `<svg class="skyline" viewBox="0 0 1600 240" preserveAspectRatio="xMidYMax slice">`;
  let x = 0, k = 0;
  while (x < 1600){ const w = 50 + (k * 29) % 60, h = 60 + (k * 53) % 110; sk += `<rect x="${x}" y="${240 - h}" width="${w}" height="${h}" ${fill(9)}/>`; x += w + 6; k++; }
  x = 20; k = 0;
  while (x < 1600){
    const w = 70 + (k * 41) % 70, h = 40 + (k * 37) % 90;
    if (!(x + w > 1150 && x < 1290)){
      sk += `<rect x="${x}" y="${240 - h}" width="${w}" height="${h}" ${fill(15)}/>`;
      for (let r = 0; r < Math.floor((h - 16) / 18); r++) for (let c = 0; c < Math.floor((w - 12) / 18); c++)
        if ((r * 7 + c * 3 + k) % 4 === 0) sk += `<rect class="bwin" x="${x + 8 + c * 18}" y="${240 - h + 10 + r * 18}" width="8" height="8" style="fill:var(--act);fill-opacity:.15;--w:${(r * 3 + c * 5 + k) % 6}s"/>`;
    }
    x += w + 40 + (k * 17) % 50; k++;
  }
  for (let i = 0; i < 8; i++) sk += `<rect class="rise-fl" x="1180" y="${220 - i * 20}" width="90" height="18" rx="1" style="fill:color-mix(in srgb,var(--act) 22%,transparent);stroke:color-mix(in srgb,var(--act) 45%,transparent);--d:${(i * 1.2).toFixed(1)}s"/>`;
  sk += `<rect x="1172" y="236" width="106" height="4" ${fill(30)}/>`;
  const stroke = "stroke:color-mix(in srgb,var(--plan) 42%,transparent);stroke-width:1.6;fill:none";
  const crane = (mx, top, left, right, jd) => {
    let pts = ""; for (let y = 240, n = 0; y >= top; y -= 12, n++) pts += `${n % 2 ? mx + 5 : mx - 5},${y} `;
    let c = `<g style="${stroke}"><line x1="${mx-5}" y1="240" x2="${mx-5}" y2="${top}"/><line x1="${mx+5}" y1="240" x2="${mx+5}" y2="${top}"/><polyline points="${pts}"/></g>`;
    c += `<g class="jib" style="transform-origin:${mx}px ${top}px;--jd:${jd}s"><g style="${stroke}"><line x1="${mx-left}" y1="${top}" x2="${mx+right}" y2="${top}"/><line x1="${mx}" y1="${top-22}" x2="${mx-left}" y2="${top}"/><line x1="${mx}" y1="${top-22}" x2="${mx+right}" y2="${top}"/><line x1="${mx}" y1="${top}" x2="${mx}" y2="${top-22}"/><line x1="${mx-left*0.7}" y1="${top}" x2="${mx-left*0.7}" y2="${top+70}"/></g><rect x="${mx-left*0.7-11}" y="${top+70}" width="22" height="6" style="fill:color-mix(in srgb,var(--act) 55%,transparent)"/><rect x="${mx+right-18}" y="${top}" width="16" height="10" ${fill(38)}/></g>`;
    c += `<circle class="beacon" cx="${mx}" cy="${top-25}" r="2.6" style="fill:var(--late)"/>`;
    return c;
  };
  sk += crane(330, 40, 190, 50, 14) + crane(1225, 22, 170, 46, 18) + crane(820, 92, 120, 36, 11);
  sk += `<rect x="0" y="238" width="1600" height="2" ${fill(30)}/></svg>`;
  const ticksA = Array.from({length:24}, (_, i) => { const a = i * Math.PI / 12, r2 = i % 2 ? 74 : 68; return `<line x1="${(100+Math.cos(a)*80).toFixed(1)}" y1="${(100+Math.sin(a)*80).toFixed(1)}" x2="${(100+Math.cos(a)*r2).toFixed(1)}" y2="${(100+Math.sin(a)*r2).toFixed(1)}"/>`; }).join("");
  const bpA = `<svg class="bp-shape s1" viewBox="0 0 200 200"><g style="fill:none;stroke:var(--plan);stroke-width:1"><circle cx="100" cy="100" r="80" stroke-dasharray="4 6"/><circle cx="100" cy="100" r="56"/><line x1="0" y1="100" x2="200" y2="100"/><line x1="100" y1="0" x2="100" y2="200"/>${ticksA}</g></svg>`;
  const bpB = `<svg class="bp-shape s2" viewBox="0 0 200 200"><g style="fill:none;stroke:var(--act);stroke-width:1"><rect x="40" y="40" width="120" height="120" stroke-dasharray="6 5"/><path d="M40 40 L160 160 M160 40 L40 160"/><circle cx="100" cy="100" r="30"/><path d="M20 40 V160 M16 40 H24 M16 160 H24"/></g></svg>`;
  host.insertAdjacentHTML("beforeend", `<div class="beam"></div>${bpA}${bpB}${m}${sk}`);
})();

window.addEventListener("hashchange", route);
(function boot(){
  const sp = document.getElementById("splash");
  if (REDUCED || !sp){ if (sp) sp.remove(); route(); return; }
  setTimeout(() => { route(); sp.classList.add("gone"); setTimeout(() => sp.remove(), 700); }, 1400);
})();
</script>
